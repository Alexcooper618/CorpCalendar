services:
  backend:
    build: ./backend
    container_name: csi_calendar_backend
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/calendar.db
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: csi_calendar_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
