services:
  backend:
    build: ./backend
    container_name: csi_calendar_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/calendar.db}
      PORT: ${PORT:-4000}
      EMPLOYEES_API_URL: ${EMPLOYEES_API_URL:-${ONEC_URL:-http://1cserv_uu/uu_2/hs/jira/employees}}
      EMPLOYEES_API_USERNAME: ${EMPLOYEES_API_USERNAME:-${ONEC_USERNAME:-}}
      EMPLOYEES_API_PASSWORD: ${EMPLOYEES_API_PASSWORD:-${ONEC_PASSWORD:-}}
      EMPLOYEES_API_TOKEN: ${EMPLOYEES_API_TOKEN:-}
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: csi_calendar_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
